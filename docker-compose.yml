name: proyecto-hotelero-distribuido

services:
  postgres-cancun:
    image: postgres:18.6
    container_name: hotel-postgres-cancun
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: hotel_cancun
    ports:
      - "5541:5432"
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - max_prepared_transactions=20
      - -c
      - archive_mode=on
      - -c
      - archive_command=mkdir -p /backups/cancun/wal && (test -f /backups/cancun/wal/%f || cp %p /backups/cancun/wal/%f)
      - -c
      - archive_timeout=60s
    volumes:
      - hotel_cancun_data:/var/lib/postgresql
      - ./backups/cancun:/backups/cancun
    networks:
      - hotel_red

  postgres-tulum:
    image: postgres:18.6
    container_name: hotel-postgres-tulum
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: hotel_tulum
    ports:
      - "5542:5432"
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - max_prepared_transactions=20
    volumes:
      - hotel_tulum_data:/var/lib/postgresql
    networks:
      - hotel_red

  postgres-bacalar:
    image: postgres:18.6
    container_name: hotel-postgres-bacalar
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: hotel_bacalar
    ports:
      - "5543:5432"
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - max_prepared_transactions=20
    volumes:
      - hotel_bacalar_data:/var/lib/postgresql
    networks:
      - hotel_red

  postgres-central:
    image: postgres:18.6
    container_name: hotel-postgres-central
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: hotel_central
    ports:
      - "5544:5432"
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - max_prepared_transactions=20
    volumes:
      - hotel_central_data:/var/lib/postgresql
    networks:
      - hotel_red

volumes:
  hotel_cancun_data:
  hotel_tulum_data:
  hotel_bacalar_data:
  hotel_central_data:

networks:
  hotel_red:
    name: hotel-proyecto-red
    driver: bridge
